services:
  backend:
    build:
      context: ./backend
    container_name: myshopupdates-backend
    ports:
      - "8000:8000"
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
    volumes:
      - ./backend/bizz_brains.db:/app/bizz_brains.db
    restart: unless-stopped
